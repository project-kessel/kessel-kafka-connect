# Debezium artifacts installed into the image.
#
# Konflux prefetches these with Hermeto (generic package manager) before the
# network-isolated build, verifies each checksum, and records them in the SBOM.
# The Dockerfile reads them from /cachi2/output/deps/generic/<filename>, so keep
# each `filename` in sync with the Dockerfile.
#
# To bump Debezium, set the new `version` on both entries and update the
# checksums from: make generate-checksums DEBEZIUM_VERSION=<x.y.z.Final>
metadata:
  version: "1.0"
artifacts:
  - type: maven
    filename: debezium-connector-postgres-plugin.tar.gz
    attributes:
      repository_url: https://repo1.maven.org/maven2
      group_id: io.debezium
      artifact_id: debezium-connector-postgres
      version: 3.1.3.Final
      classifier: plugin
      type: tar.gz
    checksum: sha256:2ed3f0b1dd3ee3b1180cc975e0464b675cca5f972db6a9ae3a75f5376874f652
  - type: maven
    filename: debezium-scripting.tar.gz
    attributes:
      repository_url: https://repo1.maven.org/maven2
      group_id: io.debezium
      artifact_id: debezium-scripting
      version: 3.1.3.Final
      type: tar.gz
    checksum: sha256:2c4053ffdcf18d0a73fc845c641c02026631ea8f598a5342741ad7b601c8251d
